<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honors Bio Quiz App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .quiz-container {
            max-width: 900px;
            margin: 2rem auto;
            background-color: #fff;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border-radius: 0.75rem; /* rounded-xl */
            padding: 2.5rem; /* p-10 */
        }
        /* Tailwind-like utility classes for buttons and inputs */
        .btn-primary {
            @apply bg-blue-500 hover:bg-blue-600 text-white font-semibold py-3 px-6 rounded-lg transition duration-300 ease-in-out transform hover:scale-105 shadow-md;
        }
        .btn-success {
            @apply bg-green-500 hover:bg-green-600 text-white font-semibold py-3 px-6 rounded-lg transition duration-300 ease-in-out transform hover:scale-105 shadow-md;
        }
        .btn-secondary {
            @apply bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-2 px-4 rounded-lg transition duration-300 ease-in-out shadow-sm;
        }
        .btn-danger {
             @apply bg-red-500 hover:bg-red-600 text-white font-semibold py-3 px-6 rounded-lg transition duration-300 ease-in-out transform hover:scale-105 shadow-md;
        }
        .input-field {
            @apply shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent;
        }
        .message-box {
            @apply px-4 py-3 rounded-lg relative mb-4;
        }
        .message-success {
            @apply bg-green-100 border border-green-400 text-green-700;
        }
        .message-error {
            @apply bg-red-100 border border-red-400 text-red-700;
        }
        .close-message {
            @apply absolute top-0 bottom-0 right-0 px-4 py-3 cursor-pointer;
        }
    </style>
</head>
<body class="min-h-screen bg-gray-100 flex flex-col items-center justify-center p-4 sm:p-6 lg:p-8">

    <!-- User ID Display - Removed as authentication is no longer used -->
    <div class="absolute top-4 right-4 bg-gray-100 text-gray-400 text-xs px-3 py-1 rounded-full shadow-sm">
        Local Storage Mode
    </div>

    <div class="w-full max-w-4xl bg-white shadow-xl rounded-xl p-6 sm:p-8 lg:p-10 mb-8">
        <h1 class="text-3xl sm:text-4xl font-bold text-center text-gray-800 mb-6">Honors Bio Quiz App</h1>

        <div id="messageContainer"></div>

        <div id="appContent" class="text-center">
            <!-- Content will be rendered here by JavaScript -->
            <p class="text-lg text-gray-700">Loading application...</p>
        </div>
    </div>

    <script type="module">
        // Global variables for app state
        let isAppReady = false; // Indicates if the application is initialized
        let isGeneratingQuestions = false; // New flag for AI generation loading

        let quizzes = []; // Stores fetched quizzes
        let currentQuiz = null;
        let currentQuestionIndex = 0;
        let userAnswers = {};
        let showResults = false;
        let feedbackMessage = '';
        let showRationale = false;

        let showCreateQuizForm = false;
        let newQuizTitle = '';
        let newQuizQuestions = [ // Initial blank question for new quiz form
            { question: '', answerOptions: [{ text: '', isCorrect: false }, { text: '', isCorrect: false }, { text: '', isCorrect: false }, { text: '', isCorrect: false }], hint: '' }
        ];
        let isSavingQuiz = false; // Flag for showing saving state

        // Local Storage Key
        const LOCAL_STORAGE_QUIZZES_KEY = 'honorsBioQuizzes';

        // --- Utility Functions for UI Updates ---

        /**
         * Displays a temporary message (success or error) to the user.
         * @param {string} type - 'success' or 'error'.
         * @param {string} message - The message to display.
         */
        function displayMessage(type, message) {
            const container = document.getElementById('messageContainer');
            if (!container) {
                console.error("Message container not found!");
                return;
            }
            // Clear any existing messages first
            container.innerHTML = '';

            const messageDiv = document.createElement('div');
            messageDiv.className = `message-box message-${type}`;
            messageDiv.innerHTML = `
                <span class="block sm:inline">${message}</span>
                <span class="close-message">
                    <svg class="fill-current h-6 w-6 text-${type === 'success' ? 'green' : 'red'}-500" role="button" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><title>Close</title><path d="M14.348 14.849a1.2 1.2 0 0 1-1.697 0L10 11.103l-2.651 2.651a1.2 1.2 0 1 1-1.697-1.697L8.303 9.406l-2.651-2.651a1.2 1.2 0 1 1 1.697-1.697L10 7.712l2.651-2.651a1.2 1.2 0 0 1 1.697 1.697L11.697 9.406l2.651 2.651a1.2 1.2 0 0 1 0 1.697z"/></svg>
                </span>
            `;
            messageDiv.querySelector('.close-message').onclick = () => messageDiv.remove();
            container.appendChild(messageDiv);

            setTimeout(() => {
                if (messageDiv.parentNode === container) { // Check if it's still in the DOM before removing
                    messageDiv.remove();
                }
            }, 3000); // Hide after 3 seconds
        }

        /**
         * Clears the main application content and renders the current view based on state.
         */
        function renderApp() {
            const appContent = document.getElementById('appContent');
            if (!appContent) {
                console.error("App content container not found!");
                return;
            }
            appContent.innerHTML = ''; // Clear previous content

            if (!isAppReady) {
                appContent.innerHTML = `<p class="text-lg text-gray-700">Loading application...</p>`;
                return;
            }

            if (showCreateQuizForm) {
                renderCreateQuizForm(appContent);
            } else if (currentQuiz) {
                if (showResults) {
                    renderQuizResults(appContent);
                } else {
                    renderCurrentQuiz(appContent);
                }
            } else {
                renderQuizList(appContent);
            }
        }

        /**
         * Renders the list of available quizzes and the option to create a new one.
         * @param {HTMLElement} parentElement - The DOM element to append content to.
         */
        function renderQuizList(parentElement) {
            const div = document.createElement('div');
            div.className = 'text-center';
            div.innerHTML = `
                <h2 class="text-2xl font-semibold text-gray-700 mb-4">Select a Quiz or Create a New One</h2>
            `;

            if (quizzes.length > 0) {
                const quizGrid = document.createElement('div');
                quizGrid.className = 'grid grid-cols-1 md:grid-cols-2 gap-4';
                quizzes.forEach(quiz => {
                    const button = document.createElement('button');
                    button.className = 'w-full btn-primary';
                    button.textContent = quiz.title;
                    button.onclick = () => selectQuiz(quiz);
                    quizGrid.appendChild(button);
                });
                div.appendChild(quizGrid);
            } else {
                const p = document.createElement('p');
                p.className = 'text-gray-600 mb-4';
                p.textContent = 'No quizzes available. Why not create one?';
                div.appendChild(p);
            }

            const createButton = document.createElement('button');
            createButton.className = 'mt-6 btn-success';
            createButton.textContent = 'Create New Quiz';
            createButton.onclick = toggleCreateQuizForm;
            div.appendChild(createButton);

            parentElement.appendChild(div);
        }

        /**
         * Renders the current quiz question.
         * @param {HTMLElement} parentElement - The DOM element to append content to.
         */
        function renderCurrentQuiz(parentElement) {
            const question = currentQuiz.questions[currentQuestionIndex];
            const div = document.createElement('div');
            div.className = 'space-y-6';
            div.innerHTML = `
                <p class="text-xl font-medium text-gray-700">Question ${currentQuestionIndex + 1} of ${currentQuiz.questions.length}</p>
                <p class="text-2xl text-gray-900 font-bold mb-4">${question.question}</p>
                <div class="grid grid-cols-1 gap-4 mb-6" id="answerOptionsContainer"></div>
                <p id="feedbackMessage" class="text-lg font-semibold mb-4"></p>
            `;

            const feedbackP = div.querySelector('#feedbackMessage');
            if (feedbackMessage) {
                feedbackP.textContent = feedbackMessage;
                feedbackP.className += ` ${userAnswers[currentQuestionIndex]?.isCorrect ? 'text-green-600' : 'text-red-600'}`;
            }

            const optionsContainer = div.querySelector('#answerOptionsContainer');
            question.answerOptions.forEach((option, index) => {
                const isSelected = userAnswers[currentQuestionIndex]?.selectedOption === option;
                const isCorrectOption = option.isCorrect;
                const isUserCorrect = userAnswers[currentQuestionIndex]?.isCorrect;

                let bgColor = 'bg-gray-200 hover:bg-gray-300';
                let textColor = 'text-gray-800';
                let border = 'border border-gray-300';

                if (showRationale && isSelected) {
                    bgColor = isUserCorrect ? 'bg-green-200' : 'bg-red-200';
                    border = isUserCorrect ? 'border-green-400' : 'border-red-400';
                } else if (showRationale && isCorrectOption) {
                    bgColor = 'bg-green-100'; // Highlight correct option even if not selected by user
                    border = 'border-green-300';
                } else if (isSelected) {
                    bgColor = 'bg-blue-300'; // Selected but no rationale yet
                }

                const button = document.createElement('button');
                button.className = `w-full py-3 px-4 rounded-lg text-lg font-medium transition duration-200 ease-in-out ${bgColor} ${textColor} ${border} transform hover:scale-105 shadow-sm
                  ${showRationale ? 'cursor-default' : 'cursor-pointer'}`;
                button.textContent = option.text;
                button.disabled = showRationale;
                button.onclick = () => handleAnswerSelect(currentQuestionIndex, option);
                optionsContainer.appendChild(button);
            });

            if (showRationale) {
                const hintP = document.createElement('p');
                hintP.className = 'text-md text-gray-700 mt-2 mb-2 italic';
                hintP.innerHTML = `<strong>Hint:</strong> ${question.hint}`;
                div.appendChild(hintP);

                const explanationP = document.createElement('p');
                explanationP.className = 'text-md text-gray-700 mb-4';
                explanationP.innerHTML = `<strong>Explanation:</strong> ${question.answerOptions.find(opt => opt.isCorrect)?.rationale}`;
                div.appendChild(explanationP);
            }

            const nextButton = document.createElement('button');
            nextButton.className = `bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-8 rounded-lg text-xl transition duration-300 ease-in-out transform hover:scale-105 shadow-lg
              ${(!showRationale && userAnswers[currentQuestionIndex] === undefined) ? 'opacity-50 cursor-not-allowed' : ''}`;
            nextButton.textContent = currentQuestionIndex === currentQuiz.questions.length - 1 ? 'Finish Quiz' : 'Next Question';
            nextButton.disabled = !showRationale && userAnswers[currentQuestionIndex] === undefined;
            nextButton.onclick = goToNextQuestion;
            div.appendChild(nextButton);

            parentElement.appendChild(div);
        }

        /**
         * Renders the quiz results screen.
         * @param {HTMLElement} parentElement - The DOM element to append content to.
         */
        function renderQuizResults(parentElement) {
            const div = document.createElement('div');
            div.className = 'space-y-6';
            div.innerHTML = `
                <h3 class="text-3xl font-bold text-gray-800 mb-4">Quiz Results</h3>
                <p class="text-2xl text-gray-700">You scored ${calculateScore()} out of ${currentQuiz.questions.length}!</p>
                <div class="mt-8 space-y-4 text-left" id="resultsDetail"></div>
            `;

            const resultsDetail = div.querySelector('#resultsDetail');
            currentQuiz.questions.forEach((q, index) => {
                const qDiv = document.createElement('div');
                qDiv.className = 'p-4 bg-gray-50 rounded-lg shadow-sm border border-gray-200';
                const userChoice = userAnswers[index]?.selectedOption?.text || 'Not answered';
                const isCorrect = userAnswers[index]?.isCorrect;
                const correctAnswerText = q.answerOptions.find(opt => opt.isCorrect)?.text;

                qDiv.innerHTML = `
                    <p class="font-semibold text-lg text-gray-900 mb-2">${index + 1}. ${q.question}</p>
                    <p class="font-medium ${isCorrect ? 'text-green-600' : 'text-red-600'}">
                        Your Answer: ${userChoice}
                        ${!isCorrect ? ` <span class="ml-2">(Correct: ${correctAnswerText})</span>` : ''}
                    </p>
                    <p class="text-sm text-gray-700 mt-1 italic">Hint: ${q.hint}</p>
                    <p class="text-sm text-gray-700 mt-1">Explanation: ${q.answerOptions.find(opt => opt.isCorrect)?.rationale}</p>
                `;
                resultsDetail.appendChild(qDiv);
            });

            const buttonContainer = document.createElement('div');
            buttonContainer.className = 'flex flex-col sm:flex-row justify-center gap-4 mt-8';

            const retakeBtn = document.createElement('button');
            retakeBtn.className = 'btn-primary';
            retakeBtn.textContent = 'Retake Quiz';
            retakeBtn.onclick = retakeQuiz;
            buttonContainer.appendChild(retakeBtn);

            const chooseAnotherBtn = document.createElement('button');
            chooseAnotherBtn.className = 'bg-gray-500 hover:bg-gray-600 text-white font-semibold py-3 px-8 rounded-lg text-xl transition duration-300 ease-in-out transform hover:scale-105 shadow-lg';
            chooseAnotherBtn.textContent = 'Choose Another Quiz';
            chooseAnotherBtn.onclick = chooseAnotherQuiz;
            buttonContainer.appendChild(chooseAnotherBtn);

            div.appendChild(buttonContainer);
            parentElement.appendChild(div);
        }

        /**
         * Renders the form for creating a new quiz.
         * @param {HTMLElement} parentElement - The DOM element to append content to.
         */
        function renderCreateQuizForm(parentElement) {
            const div = document.createElement('div');
            div.className = 'space-y-6';

            const backButton = document.createElement('button');
            backButton.className = 'mb-4 btn-secondary';
            backButton.textContent = '← Back to Quizzes';
            backButton.onclick = () => {
                showCreateQuizForm = false;
                newQuizTitle = '';
                newQuizQuestions = [{ question: '', answerOptions: [{ text: '', isCorrect: false }, { text: '', isCorrect: false }, { text: '', isCorrect: false }, { text: '', isCorrect: false }], hint: '' }];
                displayMessage('success', ''); // Clear any previous messages
                renderApp();
            };
            div.appendChild(backButton);

            const titleInputHtml = `<h2 class="text-2xl font-semibold text-gray-700 mb-4 text-center">Create New Quiz</h2>
                <div class="mb-4">
                    <label for="quizTitle" class="block text-gray-700 text-sm font-bold mb-2">Quiz Title:</label>
                    <input type="text" id="quizTitle" value="${newQuizTitle}" class="input-field" placeholder="Enter quiz title">
                </div>`;
            div.insertAdjacentHTML('beforeend', titleInputHtml);

            // New AI Generate Questions Button
            const generateButton = document.createElement('button');
            generateButton.className = `w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-300 ease-in-out transform hover:scale-105 shadow-md mb-4
                ${isGeneratingQuestions ? 'opacity-50 cursor-not-allowed' : ''}`;
            generateButton.textContent = isGeneratingQuestions ? 'Generating Questions...' : 'Generate 10 Questions with AI';
            generateButton.disabled = isGeneratingQuestions;
            generateButton.onclick = generateQuizQuestionsAI;
            div.appendChild(generateButton);

            const questionsContainer = document.createElement('div');
            questionsContainer.id = 'questionsContainer';
            div.appendChild(questionsContainer);


            newQuizQuestions.forEach((q, qIndex) => {
                const qDiv = document.createElement('div');
                qDiv.className = 'bg-gray-50 p-4 rounded-lg shadow-inner border border-gray-200 mb-4';
                qDiv.innerHTML = `
                    <h3 class="text-lg font-semibold text-gray-800 mb-3">Question ${qIndex + 1}</h3>
                    <div class="mb-3">
                        <label for="questionText-${qIndex}" class="block text-gray-700 text-sm font-bold mb-2">Question Text:</label>
                        <textarea id="questionText-${qIndex}" class="input-field" rows="3" placeholder="Enter question text">${q.question}</textarea>
                    </div>
                    <div class="mb-3">
                        <label class="block text-gray-700 text-sm font-bold mb-2">Answer Options:</label>
                        <div id="optionsForQ${qIndex}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="hint-${qIndex}" class="block text-gray-700 text-sm font-bold mb-2">Hint:</label>
                        <input type="text" id="hint-${qIndex}" value="${q.hint}" class="input-field" placeholder="Enter a hint (optional)">
                    </div>
                `;
                questionsContainer.appendChild(qDiv);

                const optionsForQ = qDiv.querySelector(`#optionsForQ${qIndex}`);
                q.answerOptions.forEach((opt, optIndex) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'flex items-center mb-2';
                    optDiv.innerHTML = `
                        <input type="radio" id="correctOption-${qIndex}-${optIndex}" name="correctOption-${qIndex}" ${opt.isCorrect ? 'checked' : ''} class="mr-2 h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                        <input type="text" value="${opt.text}" class="input-field" placeholder="Option ${optIndex + 1}">
                    `;
                    optDiv.querySelector('input[type="radio"]').onchange = () => handleNewCorrectAnswerChange(qIndex, optIndex);
                    optDiv.querySelector('input[type="text"]').oninput = (e) => handleNewAnswerOptionChange(qIndex, optIndex, e.target.value);
                    optionsForQ.appendChild(optDiv);
                });

                // Add event listeners for new question fields
                qDiv.querySelector(`#questionText-${qIndex}`).oninput = (e) => handleNewQuestionChange(qIndex, 'question', e.target.value);
                qDiv.querySelector(`#hint-${qIndex}`).oninput = (e) => handleNewQuestionChange(qIndex, 'hint', e.target.value);
            });

            const addQuestionBtn = document.createElement('button');
            addQuestionBtn.className = 'w-full bg-blue-400 hover:bg-blue-500 text-white font-semibold py-2 px-4 rounded-lg transition duration-300 ease-in-out transform hover:scale-105 shadow-md mb-4';
            addQuestionBtn.textContent = 'Add Another Question';
            addQuestionBtn.onclick = addNewQuestionField;
            div.appendChild(addQuestionBtn);

            const saveQuizBtn = document.createElement('button');
            saveQuizBtn.className = `w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-6 rounded-lg transition duration-300 ease-in-out shadow-md ${isSavingQuiz ? 'opacity-50 cursor-not-allowed' : 'transform hover:scale-105'}`;
            saveQuizBtn.textContent = isSavingQuiz ? 'Saving Quiz...' : 'Save Quiz';
            saveQuizBtn.disabled = isSavingQuiz;
            saveQuizBtn.onclick = handleSaveNewQuiz;
            div.appendChild(saveQuiz);

            // Add event listener for quiz title after it's in the DOM
            const quizTitleInput = div.querySelector('#quizTitle');
            if (quizTitleInput) {
                quizTitleInput.oninput = (e) => newQuizTitle = e.target.value;
            }

            parentElement.appendChild(div);
        }

        // --- Core Quiz Logic ---

        /**
         * Selects a quiz and resets the quiz state to start it.
         * @param {object} quiz - The quiz object to select.
         */
        function selectQuiz(quiz) {
            currentQuiz = quiz;
            currentQuestionIndex = 0;
            userAnswers = {};
            showResults = false;
            feedbackMessage = '';
            showRationale = false;
            showCreateQuizForm = false; // Ensure form is hidden
            renderApp();
        }

        /**
         * Handles the user's answer selection for the current question.
         * @param {number} questionIndex - The index of the current question.
         * @param {object} selectedOption - The selected answer option object.
         */
        function handleAnswerSelect(questionIndex, selectedOption) {
            if (showRationale) return; // Prevent re-answering

            const isCorrect = selectedOption.isCorrect;
            userAnswers[questionIndex] = { selectedOption, isCorrect };

            feedbackMessage = isCorrect ? 'Correct!' : 'Incorrect.';
            showRationale = true;
            renderApp(); // Re-render to show feedback and rationale
        }

        /**
         * Moves to the next question or submits the quiz if it's the last question.
         */
        function goToNextQuestion() {
            feedbackMessage = '';
            showRationale = false;
            if (currentQuestionIndex < currentQuiz.questions.length - 1) {
                currentQuestionIndex++;
            } else {
                submitQuiz();
            }
            renderApp();
        }

        /**
         * Submits the quiz and transitions to the results view.
         */
        function submitQuiz() {
            showResults = true;
            feedbackMessage = '';
            showRationale = false;
            renderApp();
        }

        /**
         * Retakes the current quiz from the beginning.
         */
        function retakeQuiz() {
            selectQuiz(currentQuiz); // Re-select to reset all states for the current quiz
        }

        /**
         * Navigates back to the quiz selection screen.
         */
        function chooseAnotherQuiz() {
            currentQuiz = null;
            renderApp();
        }

        /**
         * Calculates the user's score for the current quiz.
         * @returns {number} The number of correct answers.
         */
        function calculateScore() {
            let score = 0;
            Object.keys(userAnswers).forEach(qIndex => {
                if (userAnswers[qIndex].isCorrect) {
                    score++;
                }
            });
            return score;
        }

        // --- Quiz Creation Logic ---

        /**
         * Toggles the visibility of the quiz creation form.
         */
        function toggleCreateQuizForm() {
            showCreateQuizForm = !showCreateQuizForm;
            newQuizTitle = ''; // Clear form on toggle
            newQuizQuestions = [{ question: '', answerOptions: [{ text: '', isCorrect: false }, { text: '', isCorrect: false }, { text: '', isCorrect: false }, { text: '', isCorrect: false }], hint: '' }];
            renderApp();
        }

        /**
         * Handles changes to new question fields (question text, hint).
         * @param {number} qIndex - Index of the question.
         * @param {string} field - The field being changed ('question' or 'hint').
         * @param {string} value - The new value.
         */
        function handleNewQuestionChange(qIndex, field, value) {
            newQuizQuestions[qIndex][field] = value;
            // No need to re-render immediately for every input, as input values are managed by DOM
        }

        /**
         * Handles changes to new answer option text.
         * @param {number} qIndex - Index of the question.
         * @param {number} optIndex - Index of the answer option.
         * @param {string} value - The new text value.
         */
        function handleNewAnswerOptionChange(qIndex, optIndex, value) {
            newQuizQuestions[qIndex].answerOptions[optIndex].text = value;
            // No need to re-render immediately
        }

        /**
         * Handles setting the correct answer for a new question.
         * @param {number} qIndex - Index of the question.
         * @param {number} optIndex - Index of the option being set as correct.
         */
        function handleNewCorrectAnswerChange(qIndex, optIndex) {
            newQuizQuestions[qIndex].answerOptions.forEach((option, i) => {
                option.isCorrect = (i === optIndex);
            });
            // No need to re-render immediately
        }

        /**
         * Adds a new blank question field to the creation form.
         */
        function addNewQuestionField() {
            newQuizQuestions.push(
                { question: '', answerOptions: [{ text: '', isCorrect: false }, { text: '', isCorrect: false }, { text: '', isCorrect: false }, { text: '', isCorrect: false }], hint: '' }
            );
            renderApp(); // Re-render to show the new question in the form
        }

        /**
         * Saves the newly created quiz to Local Storage.
         */
        async function handleSaveNewQuiz() {
            if (!newQuizTitle.trim()) {
                displayMessage('error', "Quiz title cannot be empty.");
                return;
            }

            // Validate questions and answers
            const isValid = newQuizQuestions.every(q => {
                if (!q.question.trim()) return false;
                if (!q.answerOptions.every(opt => opt.text.trim())) return false;
                if (!q.answerOptions.some(opt => opt.isCorrect)) return false;
                return true;
            });

            if (!isValid) {
                displayMessage('error', "All questions must have text, all answer options must have text, and each question must have exactly one correct answer.");
                return;
            }

            isSavingQuiz = true;
            renderApp(); // Update button state to 'Saving...'

            try {
                // Generate a simple unique ID for the new quiz
                const newQuizId = 'quiz_' + Date.now();
                const newQuizData = {
                    id: newQuizId,
                    title: newQuizTitle,
                    questions: newQuizQuestions,
                    createdAt: new Date().toISOString()
                };

                // Load existing quizzes, add the new one, and save back to local storage
                let storedQuizzes = JSON.parse(localStorage.getItem(LOCAL_STORAGE_QUIZZES_KEY) || '[]');
                storedQuizzes.push(newQuizData);
                localStorage.setItem(LOCAL_STORAGE_QUIZZES_KEY, JSON.stringify(storedQuizzes));
                quizzes = storedQuizzes; // Update the global quizzes array

                newQuizTitle = '';
                newQuizQuestions = [ // Reset form
                    { question: '', answerOptions: [{ text: '', isCorrect: false }, { text: '', isCorrect: false }, { text: '', isCorrect: false }, { text: '', isCorrect: false }], hint: '' }
                ];
                showCreateQuizForm = false;
                displayMessage('success', 'Quiz successfully saved!');
            } catch (error) {
                console.error("Error saving new quiz to local storage:", error);
                displayMessage('error', "Failed to save quiz: " + error.message);
            } finally {
                isSavingQuiz = false;
                renderApp(); // Ensure UI reflects final state
            }
        }

        /**
         * Generates quiz questions using the Gemini API.
         * The prompt now includes content from the user's study guide.
         */
        async function generateQuizQuestionsAI() {
            isGeneratingQuestions = true;
            renderApp(); // Update button state to 'Generating...'
            displayMessage('success', 'Generating questions... This may take a moment.');

            // Content from the user's "Biology CP/CPA/H Final Exam Study Guide ~ 2025.odt"
            const studyGuideContent = `
                Biology Final Exam Review Guide

                Mitosis/Meiosis
                * What is the cell cycle? What are the parts of the cell cycle? (G1, S, G2, M phase) What happens in each of these phases?
                * What happens during Interphase of the cell cycle? (G1, S, G2)
                * Chromosome structure: sister chromatids, centromere, genes
                * What are the phases of mitosis? (PMAT)
                * What is cytokinesis?
                * What is a cell plate? What type of cell forms a cell plate during cell division?
                * What is the purpose of Meiosis?
                * What is a tetrad? When do tetrads form?
                * What is crossing over? What is genetic recombination?
                * How do mitosis and meiosis differ?
                * Mitosis occurs in what types of cells? Meiosis occurs in what types of cells?
                * What are gametes? Egg and sperm? Polar bodies? A zygote?
                * Haploid (n) vs. diploid (2n) cells.

                DNA
                * What does "DNA" stand for? What does "RNA" stand for?
                * What are the building blocks of nucleic acids (DNA/RNA)?
                * What are the 3 parts of a nucleotide?
                * What 4 types of bases are found in DNA? RNA?
                * What are the complementary base pairing rules?
                DNA: A pairs with T, C with G;
                RNA: A pairs with U
                * In what stage of the cell cycle does DNA replicate? What happens in DNA replication?
                * What are the 3 main differences between DNA and RNA?
                * How do you go from DNA to proteins?
                  * Transcription. What is it and where does it occur?
                  * Translation. What is it and where does it occur?
                * What is a codon? Anticodon?
                * What is a mutation? Why do they occur?
                * What is a base substitution? Does it always affect the amino acids produced?
                * What are base insertions and deletions?

                Genetics
                * What is genetics?
                * Who was Mendel? Why did he use pea plants to study genetics?
                * What is the P generation? F1? F2?
                * What are alleles?
                * Dominant vs. Recessive
                  * Dominant alleles are written as a capital letter (T), recessive as a lowercase (t)
                * Purebred vs. Hybrid. (Homozygous = purebred (BB or bb) / Heterozygous = hybrid (Bb))
                * Genotype vs. Phenotype ~ Genotypic and Phenotypic ratios
                * What is the law of segregation?
                * What is the law of independent assortment?
                * What is probability?
                * Use a punnett square to solve one and two factor crosses.
                  * Ex: One Factor Cross ~ A homozygous black mouse (BB) is crossed with a brown (bb) mouse. Brown is recessive. What will all of the babies (the F1) look like? If 2 F1 mated, what would be the genotype and phenotypes of their offsprings?
                  * Ex: Two Factor Cross ~ A heterozygous black, homozygous running mouse (BbRR) is crossed with a homozygous brown, heterozygous running mouse (bbRr). Black (B) is dominant to brown (b). Running (R) is dominant to waltzing (r).
                  * What are the possible gametes from each mouse?
                  * Heterozygous black, homozygous running mouse = BR and bR.
                  * Homozygous brown, heterozygous running mouse = bR and br.
                * Genetic problems involving incomplete dominance (the traits blend)
                  * Ex: RR=red. WW=white. RW=pink.
                * Genetics problems involving codominance (both traits show).
                  * Ex: BB=brown fur. WW= white fur. BW=roan (a mix of both brown and white)
                * Genetic problems involving Blood types (type AB is an example of codominance)
                * Know the genotypes and phenotypes of each blood type (A, B, AB, O)
                * What is the genotype of a male and a female? XY vs XX
                * What are sex-linked traits? Solve genetic problems involving sex-linked traits
                * What is nondisjunction?
                * Using a pedigree: how to interpret them, determine if a trait is dominant/recessive, autosomal/sex-linked, identify genotypes of individuals.

                Evolution and Classification
                * What is evolution?
                * What are the mechanisms that change allele frequencies in a population? (Gene Flow, Genetic Drift, Founder Effect, Population Bottleneck, Mutation, Natural Selection)
                * What was Lamarck's theory of evolution?
                * What is an adaptation?
                * Darwin's finches ~ Descent with Modification, Natural Selection
                * What are fossils? How do they provide evidence for evolution?
                * Homologous structures vs. Analogous structures vs. Vestigial structures
                * Biochemical evidence of evolution (DNA/amino acid sequence similarities)
                * What is a species?
                * What is the classification system? (Domain, Kingdom, Phylum, Class, Order, Family, Genus, Species)
                * What is binomial nomenclature?
            `;

            const prompt = `Generate 10 multiple-choice questions for an Honors Biology quiz based on the following study guide content.
            Each question should have 4 answer options, only one of which is correct.
            Provide a concise rationale (1-2 sentences) for each answer option (explaining why it's plausible or incorrect).
            Provide a brief, non-obvious hint for each question.
            Ensure the questions cover a mix of topics from the study guide (e.g., cell cycle, DNA, genetics, evolution, classification).
            Return the response as a JSON array of question objects.

            Study Guide Content:
            \`\`\`
            ${studyGuideContent}
            \`\`\`
            `;

            let chatHistory = [];
            chatHistory.push({ role: "user", parts: [{ text: prompt }] });

            const payload = {
                contents: chatHistory,
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "ARRAY",
                        items: {
                            type: "OBJECT",
                            properties: {
                                "question": { "type": "STRING" },
                                "answerOptions": {
                                    "type": "ARRAY",
                                    "items": {
                                        "type": "OBJECT",
                                        "properties": {
                                            "text": { "type": "STRING" },
                                            "isCorrect": { "type": "BOOLEAN" },
                                            "rationale": { "type": "STRING" }
                                        },
                                        "propertyOrdering": ["text", "isCorrect", "rationale"]
                                    },
                                    "minItems": 4,
                                    "maxItems": 4
                                },
                                "hint": { "type": "STRING" }
                            },
                            "propertyOrdering": ["question", "answerOptions", "hint"]
                        },
                        "minItems": 10,
                        "maxItems": 10
                    }
                }
            };

            const apiKey = ""; // Canvas will automatically provide this
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`API error: ${response.status} ${response.statusText} - ${errorText}`);
                }

                const result = await response.json();

                if (result.candidates && result.candidates.length > 0 &&
                    result.candidates[0].content && result.candidates[0].content.parts &&
                    result.candidates[0].content.parts.length > 0) {
                    const jsonString = result.candidates[0].content.parts[0].text;
                    const generatedQuestions = JSON.parse(jsonString);

                    newQuizQuestions = generatedQuestions;
                    newQuizTitle = "AI Generated Biology Quiz - " + new Date().toLocaleDateString();
                    displayMessage('success', 'Questions generated successfully!');
                } else {
                    throw new Error('No candidates found or unexpected API response structure.');
                }
            } catch (error) {
                console.error("Error generating questions:", error);
                displayMessage('error', "Failed to generate questions: " + error.message + ". Please try again.");
                // Optionally reset newQuizQuestions to empty or default if generation fails
                newQuizQuestions = [{ question: '', answerOptions: [{ text: '', isCorrect: false }, { text: '', isCorrect: false }, { text: '', isCorrect: false }, { text: '', isCorrect: false }], hint: '' }];
            } finally {
                isGeneratingQuestions = false;
                renderApp(); // Re-render to show generated questions or error
            }
        }


        // --- Application Initialization ---

        window.onload = async () => {
            try {
                // Load quizzes from local storage
                const storedQuizzes = localStorage.getItem(LOCAL_STORAGE_QUIZZES_KEY);
                if (storedQuizzes) {
                    quizzes = JSON.parse(storedQuizzes);
                } else {
                    quizzes = [];
                }
                isAppReady = true; // App is ready after attempting to load local data
                renderApp();
            } catch (error) {
                console.error("Failed to load application from local storage:", error);
                displayMessage('error', "Failed to load the application from local storage. " + error.message);
                isAppReady = true; // Still set to true so basic UI can render, even with an error
                renderApp();
            }
        };
    </script>
