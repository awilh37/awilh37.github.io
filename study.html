<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honors Bio Quiz App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .quiz-container {
            max-width: 900px;
            margin: 2rem auto;
            background-color: #fff;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border-radius: 0.75rem; /* rounded-xl */
            padding: 2.5rem; /* p-10 */
        }
        /* Tailwind-like utility classes for buttons and inputs */
        .btn-primary {
            @apply bg-blue-500 hover:bg-blue-600 text-white font-semibold py-3 px-6 rounded-lg transition duration-300 ease-in-out transform hover:scale-105 shadow-md;
        }
        .btn-success {
            @apply bg-green-500 hover:bg-green-600 text-white font-semibold py-3 px-6 rounded-lg transition duration-300 ease-in-out transform hover:scale-105 shadow-md;
        }
        .btn-secondary {
            @apply bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-2 px-4 rounded-lg transition duration-300 ease-in-out shadow-sm;
        }
        .btn-danger {
             @apply bg-red-500 hover:bg-red-600 text-white font-semibold py-3 px-6 rounded-lg transition duration-300 ease-in-out transform hover:scale-105 shadow-md;
        }
        .input-field {
            @apply shadow appearance-none border rounded-lg w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent;
        }
        .message-box {
            @apply px-4 py-3 rounded-lg relative mb-4;
        }
        .message-success {
            @apply bg-green-100 border border-green-400 text-green-700;
        }
        .message-error {
            @apply bg-red-100 border border-red-400 text-red-700;
        }
        .close-message {
            @apply absolute top-0 bottom-0 right-0 px-4 py-3 cursor-pointer;
        }
    </style>
</head>

        /**
         * Displays a temporary message (success or error) to the user.
         * @param {string} type - 'success' or 'error'.
         * @param {string} message - The message to display.
         */
        function displayMessage(type, message) {
            const container = document.getElementById('messageContainer');
            if (!container) {
                console.error("Message container not found!");
                return;
            }
            // Clear any existing messages first
            container.innerHTML = '';

            const messageDiv = document.createElement('div');
            messageDiv.className = `message-box message-${type}`;
            messageDiv.innerHTML = `
                <span class="block sm:inline">${message}</span>
                <span class="close-message">
                    <svg class="fill-current h-6 w-6 text-${type === 'success' ? 'green' : 'red'}-500" role="button" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><title>Close</title><path d="M14.348 14.849a1.2 1.2 0 0 1-1.697 0L10 11.103l-2.651 2.651a1.2 1.2 0 1 1-1.697-1.697L8.303 9.406l-2.651-2.651a1.2 1.2 0 1 1 1.697-1.697L10 7.712l2.651-2.651a1.2 1.2 0 0 1 1.697 1.697L11.697 9.406l2.651 2.651a1.2 1.2 0 0 1 0 1.697z"/></svg>
                </span>
            `;
            messageDiv.querySelector('.close-message').onclick = () => messageDiv.remove();
            container.appendChild(messageDiv);

            setTimeout(() => {
                if (messageDiv.parentNode === container) { // Check if it's still in the DOM before removing
                    messageDiv.remove();
                }
            }, 3000); // Hide after 3 seconds
        }

        /**
         * Clears the main application content and renders the current view based on state.
         */
        function renderApp() {
            const appContent = document.getElementById('appContent');
            if (!appContent) {
                console.error("App content container not found!");
                return;
            }
            appContent.innerHTML = ''; // Clear previous content

            if (!isAppReady) {
                appContent.innerHTML = `<p class="text-lg text-gray-700">Loading application...</p>`;
                return;
            }

            if (showCreateQuizForm) {
                renderCreateQuizForm(appContent);
            } else if (currentQuiz) {
                if (showResults) {
                    renderQuizResults(appContent);
                } else {
                    renderCurrentQuiz(appContent);
                }
            } else {
                renderQuizList(appContent);
            }
        }

            const optionsContainer = div.querySelector('#answerOptionsContainer');

                const button = document.createElement('button');

        // --- Core Quiz Logic ---

        /**
         * Selects a quiz and resets the quiz state to start it.
         * @param {object} quiz - The quiz object to select.
         */
        function selectQuiz(quiz) {
            // Create a deep copy of the quiz to avoid modifying the original stored object
            currentQuiz = JSON.parse(JSON.stringify(quiz));

            // Shuffle answer options for each question in the copied quiz
            currentQuiz.questions.forEach(q => {
                q.answerOptions.sort(() => 0.5 - Math.random());
            });

            currentQuestionIndex = 0;
            userAnswers = {};
            showResults = false;
            feedbackMessage = '';
            showRationale = false;
            showCreateQuizForm = false; // Ensure form is hidden
            renderApp();
        }

        /**
         * Handles the user's answer selection for the current question.
         * @param {number} questionIndex - The index of the current question.
         * @param {object} selectedOption - The selected answer option object.
         */
        function handleAnswerSelect(questionIndex, selectedOption) {
            if (showRationale) return; // Prevent re-answering

            const isCorrect = selectedOption.isCorrect;
            userAnswers[questionIndex] = { selectedOption, isCorrect };

            feedbackMessage = isCorrect ? 'Correct!' : 'Incorrect.';
            showRationale = true;
            renderApp(); // Re-render to show feedback and rationale
        }

        /**
         * Moves to the next question or submits the quiz if it's the last question.
         */
        function goToNextQuestion() {
            feedbackMessage = '';
            showRationale = false;
            if (currentQuestionIndex < currentQuiz.questions.length - 1) {
                currentQuestionIndex++;
            } else {
                submitQuiz();
            }
            renderApp();
        }

        /**
         * Submits the quiz and transitions to the results view.
         */
        function submitQuiz() {
            showResults = true;
            feedbackMessage = '';
            showRationale = false;
            renderApp();
        }

        /**
         * Retakes the current quiz from the beginning.
         */
        function retakeQuiz() {
            selectQuiz(currentQuiz); // Re-select to reset all states for the current quiz AND reshuffle answers
        }

        /**
         * Navigates back to the quiz selection screen.
         */
        function chooseAnotherQuiz() {
            currentQuiz = null;
            renderApp();
        }

        /**
         * Calculates the user's score for the current quiz.
         * @returns {number} The number of correct answers.
         */
        function calculateScore() {
            let score = 0;
            Object.keys(userAnswers).forEach(qIndex => {
                if (userAnswers[qIndex].isCorrect) {
                    score++;
                }
            });
            return score;
        }

        // --- Quiz Creation Logic ---

        /**
         * Toggles the visibility of the quiz creation form.
         */
        function toggleCreateQuizForm() {
            showCreateQuizForm = !showCreateQuizForm;
            newQuizTitle = ''; // Clear form on toggle
            newQuizQuestions = [{ question: '', answerOptions: [{ text: '', isCorrect: false }, { text: '', isCorrect: false }, { text: '', isCorrect: false }, { text: '', isCorrect: false }], hint: '' }];
            renderApp();
        }

        /**
         * Handles changes to new question fields (question text, hint).
         * @param {number} qIndex - Index of the question.
         * @param {string} field - The field being changed ('question' or 'hint').
         * @param {string} value - The new value.
         */
        function handleNewQuestionChange(qIndex, field, value) {
            newQuizQuestions[qIndex][field] = value;
            // No need to re-render immediately for every input, as input values are managed by DOM
        }

        /**
         * Handles changes to new answer option text.
         * @param {number} qIndex - Index of the question.
         * @param {number} optIndex - Index of the answer option.
         * @param {string} value - The new text value.
         */
        function handleNewAnswerOptionChange(qIndex, optIndex, value) {
            newQuizQuestions[qIndex].answerOptions[optIndex].text = value;
            // No need to re-render immediately
        }

        /**
         * Handles setting the correct answer for a new question.
         * @param {number} qIndex - Index of the question.
         * @param {number} optIndex - Index of the option being set as correct.
         */
        function handleNewCorrectAnswerChange(qIndex, optIndex) {
            newQuizQuestions[qIndex].answerOptions.forEach((option, i) => {
                option.isCorrect = (i === optIndex);
            });
            // No need to re-render immediately
        }

        /**
         * Adds a new blank question field to the creation form.
         */
        function addNewQuestionField() {
            newQuizQuestions.push(
                { question: '', answerOptions: [{ text: '', isCorrect: false }, { text: '', isCorrect: false }, { text: '', isCorrect: false }, { text: '', isCorrect: false }], hint: '' }
            );
            renderApp(); // Re-render to show the new question in the form
        }

        /**
         * Saves the newly created quiz to Local Storage.
         */
        async function handleSaveNewQuiz() {
            if (!newQuizTitle.trim()) {
                displayMessage('error', "Quiz title cannot be empty.");
                return;
            }

            // Validate questions and answers
            const isValid = newQuizQuestions.every(q => {
                if (!q.question.trim()) return false;
                if (!q.answerOptions.every(opt => opt.text.trim())) return false;
                if (!q.answerOptions.some(opt => opt.isCorrect)) return false;
                return true;
            });

            if (!isValid) {
                displayMessage('error', "All questions must have text, all answer options must have text, and each question must have exactly one correct answer.");
                return;
            }

            isSavingQuiz = true;
            renderApp(); // Update button state to 'Saving...'

            try {
                // Generate a simple unique ID for the new quiz
                const newQuizId = 'quiz_' + Date.now();
                const newQuizData = {
                    id: newQuizId,
                    title: newQuizTitle,
                    questions: newQuizQuestions,
                    createdAt: new Date().toISOString()
                };

                // Load existing quizzes, add the new one, and save back to local storage
                let storedQuizzes = JSON.parse(localStorage.getItem(LOCAL_STORAGE_QUIZZES_KEY) || '[]');
                storedQuizzes.push(newQuizData);
                localStorage.setItem(LOCAL_STORAGE_QUIZZES_KEY, JSON.stringify(storedQuizzes));
                quizzes = storedQuizzes; // Update the global quizzes array

                newQuizTitle = '';
                newQuizQuestions = [ // Reset form
                    { question: '', answerOptions: [{ text: '', isCorrect: false }, { text: '', isCorrect: false }, { text: '', isCorrect: false }, { text: '', isCorrect: false }], hint: '' }
                ];
                showCreateQuizForm = false;
                displayMessage('success', 'Quiz successfully saved!');
            } catch (error) {
                console.error("Error saving new quiz to local storage:", error);
                displayMessage('error', "Failed to save quiz: " + error.message);
            } finally {
                isSavingQuiz = false;
                renderApp(); // Ensure UI reflects final state
            }
        }

        /**
         * Generates quiz questions from the local pool.
         */
        function generateRandomQuizQuestions() {
            isGeneratingQuestions = true;
            renderApp(); // Update button state to 'Generating...'
            displayMessage('success', 'Generating random quiz questions...');

            try {
                const generatedQuizQuestions = [];
                const shuffledAllQuestions = [...allBiologyQuestions].sort(() => 0.5 - Math.random()); // Shuffle all questions

                // Select up to 10 unique questions
                for (let i = 0; i < Math.min(10, shuffledAllQuestions.length); i++) {
                    const originalQuestion = shuffledAllQuestions[i];
                    const correctOption = originalQuestion.allOptions.find(opt => opt.isCorrect);
                    // Ensure correctOption is found before proceeding
                    if (!correctOption) {
                        console.warn(`Question "${originalQuestion.question}" has no correct option defined. Skipping.`);
                        continue;
                    }

                    const incorrectOptionsPool = originalQuestion.allOptions.filter(opt => !opt.isCorrect);

                    // Shuffle incorrect options and pick 3 unique ones
                    const selectedIncorrectOptions = [];
                    const shuffledIncorrectPool = [...incorrectOptionsPool].sort(() => 0.5 - Math.random());

                    for (let j = 0; j < Math.min(3, shuffledIncorrectPool.length); j++) {
                        selectedIncorrectOptions.push(shuffledIncorrectPool[j]);
                    }

                    // The number of options presented to the user should always be 4.
                    // If we have fewer than 3 incorrect options in the pool,
                    // we'll still only show the available incorrect ones with the correct one.
                    // To ensure 4 options, we might need to duplicate placeholder empty options
                    // or simplify the strict 4-option requirement if the pool is too small.
                    // For now, let's assume `allOptions` will always provide enough diversity.
                    // If `selectedIncorrectOptions.length < 3` it will just provide fewer than 4 options.
                    // To strictly ensure 4 options, a more complex logic would be needed
                    // to fill up with generic "placeholder" options if no more incorrect ones exist.
                    // Given the current question structure, we have at least 4 options in `allOptions` for each.
                    // We need 1 correct and 3 incorrect. So, `allOptions` should have at least 4 items, 1 correct, and 3 incorrect.

                    const finalOptions = [correctOption, ...selectedIncorrectOptions];

                    // Ensure exactly 4 options are presented for each question in the UI
                    // If for some reason we have fewer than 4 options after picking (e.g., if a question only has 1 correct and 1 incorrect in its pool),
                    // we need to pad it to 4.
                    while (finalOptions.length < 4) {
                        finalOptions.push({ text: `(Filler option ${finalOptions.length + 1})`, isCorrect: false, rationale: "This is a placeholder option." });
                    }
                    // If by some chance we have more than 4, trim it down.
                    while (finalOptions.length > 4) {
                        finalOptions.pop();
                    }


                    // Shuffle the final options for this question
                    finalOptions.sort(() => 0.5 - Math.random());

                    generatedQuizQuestions.push({
                        question: originalQuestion.question,
                        answerOptions: finalOptions,
                        hint: originalQuestion.hint
                    });
                }

                // Determine the next quiz number based on current quizzes in local storage
                const nextQuizNumber = quizzes.length + 1;
                newQuizTitle = `Random Biology Quiz #${nextQuizNumber}`; // Removed date for cleaner title
                newQuizQuestions = generatedQuizQuestions; // Update newQuizQuestions with the generated ones
                displayMessage('success', 'Random quiz generated successfully!');

            } catch (error) {
                console.error("Error generating random questions:", error);
                displayMessage('error', "Failed to generate random questions: " + error.message + ". Please try again.");
                // Reset to a blank question if generation fails
                newQuizQuestions = [{ question: '', answerOptions: [{ text: '', isCorrect: false }, { text: '', isCorrect: false }, { text: '', isCorrect: false }, { text: '', isCorrect: false }], hint: '' }];
            } finally {
                isGeneratingQuestions = false;
                renderApp(); // Re-render to show generated questions or error
            }
        }


        // --- Application Initialization ---

        window.onload = async () => {
            try {
                // Load quizzes from local storage
                const storedQuizzes = localStorage.getItem(LOCAL_STORAGE_QUIZZES_KEY);
                if (storedQuizzes) {
                    quizzes = JSON.parse(storedQuizzes);
                } else {
                    quizzes = [];
                }
                isAppReady = true; // App is ready after attempting to load local data
                renderApp();
            } catch (error) {
                console.error("Failed to load application from local storage:", error);
                displayMessage('error', "Failed to load the application from local storage. " + error.message);
                isAppReady = true; // Still set to true so basic UI can render, even with an error
                renderApp();
            }
        };
    </script>
