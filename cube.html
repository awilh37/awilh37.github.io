<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Cube Timer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            color: #333;
            user-select: none; 
        }
        #timer {
            font-size: 8rem;
            font-weight: bold;
            color: #333;
        }
        #instructions {
            font-size: 1.2rem;
            color: #555;
            margin-top: 10px;
        }
        #results {
            margin-top: 30px;
            width: 300px;
            text-align: left;
        }
        h2 {
            margin-bottom: 10px;
            border-bottom: 2px solid #ccc;
            padding-bottom: 5px;
        }
        #timesList {
            list-style-type: decimal;
            padding-left: 30px;
            font-size: 1.2rem;
        }
        #ao5 {
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 15px;
        }

        /* --- NEW CSS for button container and Undo Button --- */
        #buttonContainer {
            display: flex;
            gap: 10px; /* Adds space between buttons */
        }
        #clearButton, #undoButton {
            margin-top: 20px;
            padding: 8px 15px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            color: white;
        }
        #clearButton {
            background-color: #d9534f;
        }
        #clearButton:hover {
            background-color: #c9302c;
        }
        #undoButton {
            background-color: #f0ad4e; /* An orange color */
        }
        #undoButton:hover {
            background-color: #ec971f;
        }
        /* --- END NEW CSS --- */

    </style>
</head>
<body>

    <div id="timer">0.00</div>
    <div id="instructions">Press Spacebar to start/stop</div>
    
    <div id="results">
        <h2>Recent 5 Solves</h2>
        <ol id="timesList"></ol>
        <div id="ao5">Ao5: N/A</div>

        <div id="buttonContainer">
            <button id="clearButton">Clear All</button>
            <button id="undoButton">Undo Last</button>
        </div>
        </div>

    <script>
        // DOM Elements
        const timerDisplay = document.getElementById('timer');
        const timesList = document.getElementById('timesList');
        const ao5Display = document.getElementById('ao5');
        const clearButton = document.getElementById('clearButton');
        const undoButton = document.getElementById('undoButton'); // <-- NEW

        // Timer State
        let timerInterval = null;
        let startTime = 0;
        let isRunning = false;
        
        // Load *all* times from localStorage
        let times = JSON.parse(localStorage.getItem('cubeTimes')) || [];

        /**
         * Formats milliseconds into a "ss.msms" string
         */
        function formatTime(ms) {
            const totalSeconds = ms / 1000;
            const seconds = Math.floor(totalSeconds);
            const milliseconds = Math.floor((totalSeconds - seconds) * 100); 
            
            return `${seconds}.${milliseconds.toString().padStart(2, '0')}`;
        }

        /**
         * Updates the timer display every interval
         */
        function updateTimer() {
            const elapsed = Date.now() - startTime;
            timerDisplay.textContent = formatTime(elapsed);
        }

        /**
         * Starts the timer
         */
        function startTimer() {
            if (isRunning) return;
            
            isRunning = true;
            startTime = Date.now();
            timerDisplay.style.color = '#d9534f';
            
            timerInterval = setInterval(updateTimer, 10);
        }

        /**
         * Stops the timer, records the time, and updates the UI
         */
        function stopTimer() {
            if (!isRunning) return;

            isRunning = false;
            clearInterval(timerInterval);
            timerDisplay.style.color = '#333'; 
            
            const solveTime = Date.now() - startTime;
            
            // Add the new time to the full list
            times.push(solveTime);
            
            // --- MODIFICATION: We no longer remove old times here ---
            // The times.shift() logic is removed.
            // --- END MODIFICATION ---
            
            saveTimes();
            updateUI();
        }

        /**
         * Saves the current times array to localStorage
         */
        function saveTimes() {
            localStorage.setItem('cubeTimes', JSON.stringify(times));
        }

        /**
         * Calculates the Average of 5 (Ao5)
         */
        function calculateAo5() {
            // --- MODIFICATION: Calculate based on *only* the last 5 times ---
            const recentTimes = times.slice(-5); // Get the last 5 elements
            
            if (recentTimes.length < 5) {
                return 'N/A';
            }
            
            // Copy and sort the *recent* times
            const sortedTimes = [...recentTimes].sort((a, b) => a - b);
            // --- END MODIFICATION ---
            
            // Discard best (index 0) and worst (index 4)
            const middleThree = sortedTimes.slice(1, 4);
            
            const sum = middleThree.reduce((total, time) => total + time, 0);
            const average = sum / 3;
            
            return formatTime(average);
        }

        /**
         * Updates the times list and Ao5 display on the page
         */
        function updateUI() {
            timesList.innerHTML = '';

            // --- MODIFICATION: Only display the 5 most recent times ---
            const recentTimes = times.slice(-5); 
            
            recentTimes.forEach(time => {
                const li = document.createElement('li');
                li.textContent = formatTime(time);
                timesList.appendChild(li);
            });
            // --- END MODIFICATION ---
            
            ao5Display.textContent = `Ao5: ${calculateAo5()}`;
        }

        /**
         * Clears all saved times
         */
        function clearAllTimes() {
            if (confirm('Are you sure you want to clear ALL solve times?')) {
                times = [];
                saveTimes();
                updateUI();
                timerDisplay.textContent = '0.00';
            }
        }

        /**
         * --- NEW FUNCTION: Removes the most recent solve ---
         */
        function undoLastSolve() {
            if (times.length > 0) {
                times.pop(); // Remove the last element from the array
                saveTimes(); // Re-save the shortened array
                updateUI();  // Update the screen
            }
        }
        // --- END NEW FUNCTION ---


        // --- Event Listeners ---

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space') {
                if (isRunning) {
                    stopTimer();
                } else {
                    startTimer();
                }
            }
        });
        
        window.addEventListener('mousedown', () => {
             if (isRunning) {
                 stopTimer();
             }
        });
        window.addEventListener('touchstart', () => {
             if (isRunning) {
                 stopTimer();
             }
        });

        clearButton.addEventListener('click', clearAllTimes);
        undoButton.addEventListener('click', undoLastSolve); // <-- NEW
        
        // Initial load
        updateUI();

    </script>
</body>
</html>
