<button id="stopAllAudioButton">Pause All Audio</button>

<script>     document.addEventListener('DOMContentLoaded', () => {
        const stopButton = document.getElementById('stopAllAudioButton');

        stopButton.addEventListener('click', () => {
            const allAudios = document.querySelectorAll('audio'); // Select all audio elements
            allAudios.forEach(audioEl => {
                audioEl.pause(); // Pause each audio element
            });
        });
    });</script>
